name: CI/CD Pipeline

on:
  push:
    branches:
      - trangchubloxfruit

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.1

      - name: Fake .env from example
        run: cp .env.example .env

      - name: Set up Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: mondo0810
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        run: |
          # Build & push actual images
          docker compose build
          docker compose push

  copy-compose:
    name: Copy Docker Compose to Server
    runs-on: ubuntu-latest
    needs: build-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@master
        with:
          host: 89.251.25.64
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 24700
          source: "docker-compose.yml"
          target: "/home/mondo0810/snapvideo"

  deploy:
    name: Deploy on Server
    runs-on: ubuntu-latest
    needs: copy-compose

    steps:
      - name: SSH and Pull + Restart
        uses: appleboy/ssh-action@master
        with:
          host: 89.251.25.64
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 24700
          script: |
            cd /home/mondo0810/snapvideo

            echo "Pull latest Docker images from Docker Hub..."
            docker compose pull

            echo "Restart services..."
            docker compose up -d

            echo "Clean up unused Docker data..."
            docker image prune -f
            docker system prune -f
